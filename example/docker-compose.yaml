services:
  db-primary:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=sezdb
      - POSTGRES_USER=andruf
      - POSTGRES_PASSWORD=andruf
    command: |
      postgres 
      -c wal_level=replica 
      -c max_wal_senders=10 
      -c max_replication_slots=10
    ports:
      - "5432:5432"
  db-replica:
    image: postgres:15-alpine
    depends_on:
      - db-primary
    environment:
      - POSTGRES_DB=sezdb
      - POSTGRES_USER=andruf
      - POSTGRES_PASSWORD=andruf
    ports:
      - "5433:5432"

  mongodb:
    image: mongo:latest
    ports:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

  redis-master:
    image: redis:latest
    ports:
      - "6379"

  redis-slave:
      image: redis:latest
      command: redis-server --slaveof redis-master 6379
      depends_on:
        - redis-master

  redis-sentinel:
      image: bitnami/redis-sentinel:latest
      environment:
        - REDIS_MASTER_NAME=mymaster
        - REDIS_MASTER_HOST=redis-master
        - REDIS_SENTINEL_QUORUM=1
      ports:
        - "26379"
      depends_on:
        - redis-master
        - redis-slave